<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Math</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            text-align: center;
            color: #333;
            min-height: 100vh;
        }
        h1 { 
            font-size: 3.2rem; 
            color: white; 
            text-shadow: 3px 3px 10px rgba(0,0,0,0.3);
            margin-bottom: 8px;
        }
        .subtitle { 
            font-size: 1.5rem; 
            color: white; 
            margin-bottom: 50px;
        }
        
        .students {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 35px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }
        .card h2 { 
            margin: 0 0 18px 0; 
            color: #1e3a8a; 
            font-size: 2rem;
        }
        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 14px 32px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #1e40af;
            transform: scale(1.05);
        }
        footer {
            margin-top: 70px;
            color: rgba(255,255,255,0.9);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <h1>☀️ Summer Math</h1>
    <p class="subtitle">Choose your student to start their math activities</p>

    <div class="students">
        <div class="card">
            <h2>Henry</h2>
            <a href="henry/" class="btn">Open Henry's App</a>
        </div>
        
        <div class="card">
            <h2>Nora</h2>
            <a href="nora/" class="btn">Open Nora's App</a>
        </div>
        
        <div class="card">
            <h2>Sam</h2>
            <a href="sam/" class="btn">Open Sam's App</a>
        </div>
        
        <div class="card">
            <h2>Jake</h2>
            <a href="jake/" class="btn">Open Jake's App</a>
        </div>
    </div>

    <footer>
        <p>Summer Math 2026 • Hosted on GitHub Pages</p>
        <p><small>123asd098lkj / Summer-Math</small></p>
    </footer>
</body>
</html>
