<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Math</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            text-align: center;
            color: #333;
        }
        h1 { font-size: 3rem; color: white; margin-bottom: 10px; }
        .subtitle { font-size: 1.5rem; color: white; margin-bottom: 50px; }
        
        .students {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .card h2 { margin: 0 0 15px 0; color: #1e3a8a; }
        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 14px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn:hover { background: #1e40af; }
    </style>
</head>
<body>
    <h1>☀️ Summer Math</h1>
    <p class="subtitle">Choose a student to begin</p>

    <div class="students">
        <div class="card">
            <h2>Henry</h2>
            <a href="henry/" class="btn">Open Henry's Math App</a>
        </div>
        <div class="card">
            <h2>Nora</h2>
            <a href="nora/" class="btn">Open Nora's Math App</a>
        </div>
        <div class="card">
            <h2>Sam</h2>
            <a href="sam/" class="btn">Open Sam's Math App</a>
        </div>
        <div class="card">
            <h2>Jake</h2>
            <a href="jake/" class="btn">Open Jake's Math App</a>
        </div>
    </div>
</body>
</html>
