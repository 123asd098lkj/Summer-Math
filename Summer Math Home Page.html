<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Math</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #333;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 3.5rem;
            color: white;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.4rem;
            color: white;
            margin-bottom: 50px;
        }
        .students {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }
        .card h2 {
            margin: 0 0 15px 0;
            color: #1e3a8a;
            font-size: 1.8rem;
        }
        .card p {
            color: #555;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 28px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #1e40af;
            transform: scale(1.05);
        }
        footer {
            margin-top: 60px;
            color: white;
            opacity: 0.9;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>☀️ Summer Math</h1>
        <p class="subtitle">Fun Math Practice for Summer Learning</p>

        <div class="students">
            <div class="card">
                <h2>Henry</h2>
                <p>Henry's Math Activities</p>
                <a href="henry/" class="btn">Go to Henry's Page</a>
            </div>

            <div class="card">
                <h2>Nora</h2>
                <p>Nora's Math Activities</p>
                <a href="nora/" class="btn">Go to Nora's Page</a>
            </div>

            <div class="card">
                <h2>Sam</h2>
                <p>Sam's Math Activities</p>
                <a href="sam/" class="btn">Go to Sam's Page</a>
            </div>

            <div class="card">
                <h2>Jake</h2>
                <p>Jake's Math Activities</p>
                <a href="jake/" class="btn">Go to Jake's Page</a>
            </div>
        </div>

        <footer>
            <p>Made for Summer 2026 • Have fun learning math!</p>
        </footer>
    </div>
</body>
</html>
